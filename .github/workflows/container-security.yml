name: Container Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  security-events: write   # required for uploading SARIF to GitHub Security tab
  packages: write          # required for pushing images to ghcr.io
  id-token: write          # required for keyless Cosign signing via Sigstore OIDC

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Policy tests — no Docker required, fast feedback on every push.
  # ---------------------------------------------------------------------------
  policy-tests:
    name: Policy tests (OPA + Kyverno + Falco)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -sL https://openpolicyagent.org/downloads/v0.70.0/opa_linux_amd64_static \
            -o /usr/local/bin/opa
          chmod +x /usr/local/bin/opa
          opa version

      - name: Install Kyverno CLI
        run: |
          curl -sL https://github.com/kyverno/kyverno/releases/download/v1.17.1/kyverno-cli_v1.17.1_linux_x86_64.tar.gz \
            | tar xz -C /tmp kyverno && mv /tmp/kyverno /usr/local/bin/kyverno
          kyverno version

      - name: All policy and rule tests (OPA + Kyverno + Falco)
        run: make test-all

  # ---------------------------------------------------------------------------
  # Job 2: Failure demo — show that the scanner and linter correctly reject
  # a deliberately insecure Dockerfile and a known-vulnerable base image.
  # This job is expected to produce findings; it documents the failure path.
  # ---------------------------------------------------------------------------
  failure-demo:
    name: Failure demo (unhardened)
    runs-on: ubuntu-latest
    needs: policy-tests

    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.57.0/conftest_0.57.0_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin conftest
          conftest --version

      # Conftest MUST find violations — exit 0 from conftest means no violations,
      # which would mean our policies aren't working.
      - name: OPA lint rejects unhardened Dockerfile
        run: |
          set +e
          conftest test examples/unhardened/Dockerfile \
            --policy policies/opa/ \
            --namespace docker.security
          EXIT=$?
          set -e
          echo "conftest exit code: $EXIT"
          if [ "$EXIT" -eq 0 ]; then
            echo "ERROR: conftest found no violations in the unhardened Dockerfile — policies are not working."
            exit 1
          fi
          echo "PASS: conftest correctly rejected the unhardened Dockerfile."

      # Trivy scans the upstream node:18 base directly (no build needed).
      # We assert findings ARE present; a clean scan would mean the demo is broken.
      - name: Trivy finds CVEs in node:18 base image
        run: |
          curl -sL https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz \
            | tar xz -C /usr/local/bin trivy
          set +e
          trivy image --severity CRITICAL,HIGH --exit-code 1 \
            --no-progress node:18 2>&1 | tee /tmp/trivy-node18.txt
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "trivy exit code: $EXIT"
          if [ "$EXIT" -eq 0 ]; then
            echo "ERROR: Trivy found no CRITICAL/HIGH CVEs in node:18 — demo baseline is unexpectedly clean."
            exit 1
          fi
          echo "PASS: Trivy correctly found CVEs in node:18."

      # Build the unhardened image and run negative structure tests against it.
      # These assert the image HAS the problems the hardened images eliminate:
      # runs as root, SUID binaries present, wget/curl/perl/apt-get installed.
      - name: Install container-structure-test
        run: |
          curl -sL https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.19.3/container-structure-test-linux-amd64 \
            -o /usr/local/bin/container-structure-test
          chmod +x /usr/local/bin/container-structure-test

      - name: Build unhardened image
        run: |
          docker build \
            --tag unhardened:latest \
            --file examples/unhardened/Dockerfile \
            examples/unhardened/

      - name: Negative structure tests (unhardened image has expected problems)
        run: |
          container-structure-test test \
            --image unhardened:latest \
            --config tests/structure/unhardened.yaml

  # ---------------------------------------------------------------------------
  # Job 3: Image pipeline — build, lint, scan, SBOM, structure test.
  # Only runs after policy-tests passes.
  # ---------------------------------------------------------------------------
  image-pipeline:
    name: Image pipeline (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: policy-tests

    strategy:
      fail-fast: false
      matrix:
        image: [python, node, nginx, go]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Dockerfile lint via Conftest / OPA
      # -----------------------------------------------------------------------
      - name: Install Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.57.0/conftest_0.57.0_Linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin conftest
          conftest --version

      - name: Lint Dockerfile (OPA policies)
        run: make lint IMAGE=${{ matrix.image }}

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Build image
        run: make build IMAGE=${{ matrix.image }}

      # -----------------------------------------------------------------------
      # Trivy vulnerability scan
      # Primary gate: make scan prints every CRITICAL/HIGH finding, then checks
      # KEV, EPSS, fix age, and register review age. Missing evidence fails.
      # Secondary: trivy-action uploads SARIF to GitHub Security tab.
      # -----------------------------------------------------------------------
      - name: Install Trivy
        run: |
          curl -sL https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz \
            | tar xz -C /usr/local/bin trivy
          trivy --version

      - name: Scan with Trivy (gate)
        run: make scan IMAGE=${{ matrix.image }}

      - name: Scan with Trivy (SARIF upload)
        uses: aquasecurity/trivy-action@0.35.0
        if: always()
        with:
          image-ref: hardened-${{ matrix.image }}:latest
          format: sarif
          output: reports/${{ matrix.image }}/trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/${{ matrix.image }}/trivy.sarif
          category: trivy-${{ matrix.image }}

      # -----------------------------------------------------------------------
      # SBOM generation
      # -----------------------------------------------------------------------
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: make sbom IMAGE=${{ matrix.image }}

      # -----------------------------------------------------------------------
      # Container structure tests
      # -----------------------------------------------------------------------
      - name: Install container-structure-test
        run: |
          curl -sL https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.19.3/container-structure-test-linux-amd64 \
            -o /usr/local/bin/container-structure-test
          chmod +x /usr/local/bin/container-structure-test
          container-structure-test version

      - name: Run structure tests
        run: make test-structure IMAGE=${{ matrix.image }}

      # -----------------------------------------------------------------------
      # Push to GitHub Container Registry and sign with Cosign (keyless)
      #
      # Only runs on pushes to the main/master branch. Pull requests from forks
      # do not have packages:write or id-token:write access, so these steps
      # are intentionally skipped for PRs.
      #
      # Image naming: ghcr.io/<owner>/container-hardening-lab-<image>:latest
      # The push step captures the digest produced by `docker push` — signing
      # the digest (not the tag) ensures the signature is tamper-evident.
      # Tags are mutable; digests are not.
      #
      # Keyless signing flow:
      #   1. cosign requests a certificate from Sigstore Fulcio using the
      #      GitHub Actions OIDC token as proof of identity
      #   2. Fulcio issues a short-lived certificate embedding the workflow URL
      #      as the subject: .github/workflows/container-security.yml@refs/heads/main
      #   3. cosign uploads the signature + certificate to the Sigstore Rekor
      #      transparency log (immutable, append-only)
      #   4. The signature is stored in the registry alongside the image
      #
      # Verification (no key required):
      #   cosign verify \
      #     --certificate-identity-regexp \
      #       "https://github.com/R055LE/container-hardening-lab/.github/workflows/container-security.yml@refs/heads/main" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     ghcr.io/${{ github.repository_owner }}/container-hardening-lab-<image>:latest
      # -----------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to ghcr.io
        if: github.event_name == 'push'
        id: push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${OWNER}/container-hardening-lab-${{ matrix.image }}:latest"
          docker tag "hardened-${{ matrix.image }}:latest" "$IMAGE_REF"
          # Capture the immutable digest from docker push — tags are mutable,
          # so signing the digest (not the tag) ensures tamper-evidence.
          DIGEST=$(docker push "$IMAGE_REF" | grep -oP 'digest: \Ksha256:[a-f0-9]+')
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        if: github.event_name == 'push'
        run: |
          IMAGE_REF="${{ steps.push.outputs.image_ref }}"
          DIGEST="${{ steps.push.outputs.digest }}"
          # Sign by digest — the immutable content-addressable identifier.
          # This binds the signature to the exact image bytes, not a mutable tag.
          cosign sign --yes "${IMAGE_REF%%:*}@${DIGEST}"

      # -----------------------------------------------------------------------
      # Upload all reports as a build artifact
      # -----------------------------------------------------------------------
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ matrix.image }}
          path: reports/${{ matrix.image }}/
          retention-days: 30
