# tests/structure/node.yaml
# Container structure tests for the hardened Node.js image.
#
# Run (after building the image):
#   container-structure-test test \
#     --image hardened-node:latest \
#     --config tests/structure/node.yaml
#
# Distroless note: this image has no shell, no coreutils, no `id`, no `find`.
# Every commandTest runs through the node binary, the only executable present,
# and node reports its own uid and cwd. The CIS 4.8 SUID/SGID sweep, which
# needed `find`, moved to scripts/check-suid.sh and runs from the host as part
# of `make test-structure`. It was not dropped.

schemaVersion: "2.0.0"

metadataTest:
  # CIS 4.1: the distroless built-in `nonroot` (65532) replaces the `appuser`
  # (10001) the Debian-based image created with useradd.
  user: "nonroot"
  workdir: "/app"
  exposedPorts:
    - "3000"
  # Absolute path: `node` is not on PATH in this base image, and there is no
  # shell to resolve it. A bare `node` entrypoint would fail to start.
  entrypoint:
    - "/nodejs/bin/node"
  cmd:
    - "src/index.js"
  labels:
    - key: "org.opencontainers.image.title"
      value: "hardened-node"
    - key: "org.opencontainers.image.vendor"
      value: "container-hardening-lab"

commandTests:

  # CIS 4.1: the process must actually run as non-root, not merely declare it.
  - name: "runtime user is non-root (UID 65532)"
    command: "/nodejs/bin/node"
    args: ["-e", "process.stdout.write(String(process.getuid()))"]
    expectedOutput:
      - "^65532$"
    excludedOutput:
      - "^0$"

  # Native addons compile against a specific module ABI, so the runtime major
  # must match the builder's.
  - name: "runtime is Node 24"
    command: "/nodejs/bin/node"
    args: ["--version"]
    expectedOutput:
      - "^v24\\."

  # Proves node_modules survived the copy and resolves from /app.
  - name: "express is importable"
    command: "/nodejs/bin/node"
    args: ["-e", "require('express'); process.stdout.write('ok')"]
    expectedOutput:
      - "^ok$"

  - name: "working directory is /app"
    command: "/nodejs/bin/node"
    args: ["-e", "process.stdout.write(process.cwd())"]
    expectedOutput:
      - "^/app$"

fileExistenceTests:

  # The defining property of this base image.
  - name: "no shell present"
    path: "/bin/sh"
    shouldExist: false

  - name: "no bash present"
    path: "/bin/bash"
    shouldExist: false

  # npm bundles its own copies of glob, minimatch, tar and others, which
  # accumulate CVEs independently of the application's node_modules. The
  # previous image deleted them explicitly; this base never had them.
  - name: "npm is not present"
    path: "/usr/local/bin/npm"
    shouldExist: false

  - name: "npm bundled modules are not present"
    path: "/usr/local/lib/node_modules/npm"
    shouldExist: false

  - name: "wget is not present"
    path: "/usr/bin/wget"
    shouldExist: false

  - name: "curl is not present"
    path: "/usr/bin/curl"
    shouldExist: false

  - name: "perl is not present"
    path: "/usr/bin/perl"
    shouldExist: false

  - name: "src/index.js exists"
    path: "/app/src/index.js"
    shouldExist: true

  - name: "node_modules/express exists"
    path: "/app/node_modules/express"
    shouldExist: true

  - name: "/root/.ssh does not exist"
    path: "/root/.ssh"
    shouldExist: false

fileContentTests:

  - name: "nonroot has a nologin shell in /etc/passwd"
    path: "/etc/passwd"
    expectedContents:
      - "nonroot:x:65532:65532:.*:/sbin/nologin"
